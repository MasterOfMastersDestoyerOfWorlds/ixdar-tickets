[project]
name = "ixdar-tickets"
version = "0.1.0"
description = "Ixdar ticket board generator and editor, installed as the tix command."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
tix = "generate_board:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["generate_board.py"]
sources = ["."]
